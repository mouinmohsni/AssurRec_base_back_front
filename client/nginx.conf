server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Même limite de corps que celle de l'API Express.
    client_max_body_size 1m;

    # Transmettre les requêtes API au conteneur du serveur.
    location ^~ /api/ {
        # Sans slash final : conserver le préfixe /api.
        proxy_pass http://assurrec-api:4000;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ne pas remplacer une route API manquante par une page React.
    location = /api {
        return 404;
    }

    # Les assets manquants doivent renvoyer une vraie erreur 404.
    location /assets/ {
        try_files $uri =404;
    }

    # Permettre le rafraîchissement des routes React,
    # par exemple /dossiers/12.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

