name: Tests automatisés AssurRec

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  # Valeurs uniquement fictives, destinées au lanceur de test de GitHub Actions.
  MYSQL_PASSWORD: AssurRec-CI-2026!
  MYSQL_ROOT_PASSWORD: AssurRec-CI-Root-2026!
  DEMO_PASSWORD: AssurRec-Demo-2026!

jobs:
  backend:
    name: Tests unitaires et analyse statique du serveur
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Installation reproductible des dépendances
        run: npm ci --no-fund --no-audit

      - name: Contrôle de syntaxe et de lint
        run: npm run check

      - name: Tests unitaires Jest avec couverture
        run: npm test -- --coverage

      - name: Conserver le rapport de couverture comme preuve
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-serveur
          path: server/coverage
          if-no-files-found: warn

  frontend:
    name: Lint et compilation du client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Contrôle de lint du client
        run: npm run check
      - name: Compilation Vite
        run: npm run build

  securite:
    name: SAST et SCA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: SCA serveur — dépendances de production
        working-directory: server
        run: npm ci --omit=dev --no-fund --no-audit && npm audit --omit=dev --audit-level=high

      - name: SCA client — dépendances de production
        working-directory: client
        run: npm audit --omit=dev --audit-level=high

      - name: Installer Semgrep (SAST)
        run: |
          python3 -m pip install --user --break-system-packages semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Analyse SAST du serveur et du client
        run: |
          semgrep scan \
            --config p/default --config p/nodejs \
            --config p/security-audit --config p/secrets \
            --metrics=off --json -o sast-report.json \
            server client/src

      - name: Afficher le résumé des findings
        if: always()
        run: |
          python3 - <<'PY'
          import collections, json, pathlib
          p = pathlib.Path("sast-report.json")
          if not p.exists():
              print("Rapport SAST absent : étape analysée comme échouée.")
              raise SystemExit(1)
          results = json.loads(p.read_text(encoding="utf-8"))["results"]
          print(f"Total des findings SAST : {len(results)}")
          for severity, count in collections.Counter(
              item["extra"]["severity"] for item in results
          ).items():
              print(f"- {severity} : {count}")
          for item in results[:20]:
              print(
                  item["extra"]["severity"],
                  item["check_id"],
                  item["path"],
                  item["start"]["line"],
              )
          PY

      - name: Conserver les rapports de sécurité
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-securite
          path: sast-report.json
          if-no-files-found: warn

  portabilite:
    name: Build Docker et vérification de la stack
    runs-on: ubuntu-latest
    needs: [backend, frontend, securite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Construire les images du serveur et du client
        run: docker compose build

      - name: Démarrer MySQL, l'API et le client
        run: docker compose up -d --wait

      - name: Appliquer la migration puis le jeu de données fictif
        run: |
          docker compose exec -T assurrec-api node database/migrate.js
          docker compose exec -T assurrec-api node database/seed.js

      - name: Attendre la préparation de l'API (migration marquée)
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/api/health > /tmp/health.json; then
              cat /tmp/health.json; exit 0
            fi
            sleep 2
          done
          echo "L'API n'a pas atteint /api/health en 60 s."
          docker compose ps
          exit 1

      - name: Vérifier l'API à travers le proxy Nginx du client
        run: |
          curl --fail --silent -o /dev/null -w "client=%{http_code}\n" http://localhost:8080/

      - name: Tests d'intégration API avec Newman
        run: |
          npx --yes newman@6 run tests/postman/AssurRec.postman_collection.json \
            --env-var "baseUrl=http://localhost:8080/api" \
            --env-var "demoPassword=${DEMO_PASSWORD}" \
            --reporters cli,json \
            --reporter-json-export newman-result.json \
            --bail

      - name: Conserver le résultat Newman comme preuve
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultat-tests-api-newman
          path: newman-result.json
          if-no-files-found: warn

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --tail=60

      - name: Arrêter et nettoyer la stack
        if: always()
        run: docker compose down -v
